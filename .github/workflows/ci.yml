---
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: timmo001/workflows/.github/workflows/build-bun-cli.yml@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
    with:
      smoke-test: |-
        ./dist/notes --help
        ./dist/notes root

  capture:
    uses: timmo001/workflows/.github/workflows/run-mise-task.yml@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
    with:
      name: Build capture PWA
      task: capture:build
