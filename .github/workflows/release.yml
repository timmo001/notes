---
name: Package stable release

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release-version:
        description: Stable GitHub Release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    release-linux-${{
      inputs.release-version || github.event.release.tag_name
    }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Linux packages
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !github.event.release.prerelease
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: timmo001/workflows/.github/workflows/release-bun-cli-linux.yml@4562274d170ccaa4b5d5bc776684caaa8d61b007 # 20261002.0
    with:
      binary-name: notes
      package-name: repo-notes
      entrypoint: src/index.ts
      package-config: .scripts/linux/nfpm.yaml
      bun-version: 1.4.2
      smoke-test-arguments: |-
        --help
        root
      package-prepare-command: |-
        mkdir -p .scripts/linux/completions
        ./dist/release/root/notes --completions bash > .scripts/linux/completions/notes.bash
        ./dist/release/root/notes --completions fish > .scripts/linux/completions/notes.fish
        ./dist/release/root/notes --completions zsh > .scripts/linux/completions/_notes
      release-version: >-
        ${{ inputs.release-version || github.event.release.tag_name }}
      source-ref: >-
        ${{ inputs.release-version || github.event.release.tag_name }}
      existing-release: true
      attest: true

  prepare-arch-bin:
    name: Prepare Arch package (repo-notes-bin)
    needs: release
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: >-
        ${{ inputs.release-version || github.event.release.tag_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_VERSION }}

      - name: Render PKGBUILD
        uses: timmo001/workflows/.github/actions/prepare-arch-bin@4562274d170ccaa4b5d5bc776684caaa8d61b007 # 20261002.0
        with:
          releaseVersion: ${{ env.RELEASE_VERSION }}
          packageName: repo-notes
          binaryName: notes
          pkgbuildTemplate: .scripts/linux/PKGBUILD.bin
          outputDirectory: ${{ runner.temp }}/arch-bin
          completionsArguments: "--completions {shell}"
          extraFiles: |-
            LICENSE
            .scripts/linux/repo-notes.install

      - name: Upload package files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arch-repo-notes-bin-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arch-bin
          if-no-files-found: error
          retention-days: 1

  arch-bin:
    name: Arch package (repo-notes-bin)
    needs: prepare-arch-bin
    uses: timmo001/workflows/.github/workflows/build-arch-package.yml@4562274d170ccaa4b5d5bc776684caaa8d61b007 # 20261002.0
    with:
      package-name: repo-notes-bin
      package-files-artifact-name: arch-repo-notes-bin-${{ github.run_id }}-${{ github.run_attempt }}
      pkgbuild-path: PKGBUILD
    secrets:
      ARCH_REPO_DISPATCH_TOKEN: ${{ secrets.ARCH_REPO_DISPATCH_TOKEN }}

  attach-arch-bin:
    name: Attach Arch package (repo-notes-bin)
    needs: arch-bin
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: timmo001/workflows/.github/workflows/attach-release-arch-package.yml@4562274d170ccaa4b5d5bc776684caaa8d61b007 # 20261002.0
    with:
      artifact-name: ${{ needs.arch-bin.outputs.artifact-name }}
      release-tag: ${{ inputs.release-version || github.event.release.tag_name }}
      package-name: repo-notes-bin

  publish-aur:
    name: Publish AUR (repo-notes-bin)
    needs: prepare-arch-bin
    uses: timmo001/workflows/.github/workflows/publish-aur.yml@4562274d170ccaa4b5d5bc776684caaa8d61b007 # 20261002.0
    with:
      package-name: repo-notes-bin
      artifact-name: arch-repo-notes-bin-${{ github.run_id }}-${{ github.run_attempt }}
      auxiliary-file-paths: |-
        notes.bash
        notes.fish
        _notes
        LICENSE
        repo-notes.install
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
