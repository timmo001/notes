---
# Deploys the prod stage of the capture Worker's Alchemy stack in
# capture/alchemy.run.ts from main: the notes-capture Worker at
# capture.notes.timmo.dev. The Cloudflare token and the Worker's vars come from
# docs/stacks/github.ts.
name: Deploy capture

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-capture.yml
      - capture/**
      - mise.toml
  workflow_dispatch: {}

# Deploys queue rather than cancel, so a stack update never stops halfway
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    uses: timmo001/workflows/.github/workflows/deploy-alchemy.yml@5ca45f8d789b67b2c3c14aea6062a379d6c37db1 # 20261123.0
    with:
      task: capture:deploy
      fetch-depth: 1
      # Cloudflare Access answers before the Worker, sending anyone without a
      # login to sign in
      smoke-check: https://capture.notes.timmo.dev/ 302
      env: |
        CAPTURE_ACCESS_TEAM_DOMAIN=${{ vars.CAPTURE_ACCESS_TEAM_DOMAIN }}
        CAPTURE_GITHUB_OWNER=${{ vars.CAPTURE_GITHUB_OWNER }}
        CAPTURE_QUEUE_LABEL=${{ vars.CAPTURE_QUEUE_LABEL }}
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SECRET_ENV: |
        CAPTURE_ACCESS_AUD=${{ secrets.CAPTURE_ACCESS_AUD }}
        CAPTURE_GITHUB_REPO=${{ secrets.CAPTURE_GITHUB_REPO }}
        CAPTURE_REPOSITORIES=${{ secrets.CAPTURE_REPOSITORIES }}
