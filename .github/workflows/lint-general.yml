  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@eb72c42c7031cc36a9a70a7541bc6a05f6b43436 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@eb72c42c7031cc36a9a70a7541bc6a05f6b43436 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@eb72c42c7031cc36a9a70a7541bc6a05f6b43436 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@eb72c42c7031cc36a9a70a7541bc6a05f6b43436 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@eb72c42c7031cc36a9a70a7541bc6a05f6b43436 # master

  shellcheck:
