---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  skills:
    uses: timmo001/workflows/.github/workflows/lint-agent-skills.yml@95bc0605822adb7ca5a189e8a5c493cbb223b810 # master

  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@95bc0605822adb7ca5a189e8a5c493cbb223b810 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@95bc0605822adb7ca5a189e8a5c493cbb223b810 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@95bc0605822adb7ca5a189e8a5c493cbb223b810 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@95bc0605822adb7ca5a189e8a5c493cbb223b810 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@95bc0605822adb7ca5a189e8a5c493cbb223b810 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@95bc0605822adb7ca5a189e8a5c493cbb223b810 # master
    with:
      scandir: ./.scripts
      severity: warning
