  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@111a75f50ee7db97bcc83545d723b6d519793a0a # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@111a75f50ee7db97bcc83545d723b6d519793a0a # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@111a75f50ee7db97bcc83545d723b6d519793a0a # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@111a75f50ee7db97bcc83545d723b6d519793a0a # master

  markdown-links:
