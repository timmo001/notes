---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  skills:
    uses: timmo001/workflows/.github/workflows/lint-agent-skills.yml@992c769d64bb0306810e3fa8db52055a55e31b3a # master

  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@992c769d64bb0306810e3fa8db52055a55e31b3a # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@992c769d64bb0306810e3fa8db52055a55e31b3a # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@992c769d64bb0306810e3fa8db52055a55e31b3a # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@992c769d64bb0306810e3fa8db52055a55e31b3a # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@992c769d64bb0306810e3fa8db52055a55e31b3a # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@992c769d64bb0306810e3fa8db52055a55e31b3a # master
    with:
      scandir: ./.scripts
      severity: warning
