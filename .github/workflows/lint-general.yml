  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@bc7fcb469c61c2e931c47a92e1ebd68227f5e96a # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@bc7fcb469c61c2e931c47a92e1ebd68227f5e96a # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@bc7fcb469c61c2e931c47a92e1ebd68227f5e96a # master

