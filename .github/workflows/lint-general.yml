---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  skills:
    uses: timmo001/workflows/.github/workflows/lint-agent-skills.yml@e0ff73a140a248864e7fd3c459ed097841742bb6 # master

  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@e0ff73a140a248864e7fd3c459ed097841742bb6 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@e0ff73a140a248864e7fd3c459ed097841742bb6 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@e0ff73a140a248864e7fd3c459ed097841742bb6 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@e0ff73a140a248864e7fd3c459ed097841742bb6 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@e0ff73a140a248864e7fd3c459ed097841742bb6 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@e0ff73a140a248864e7fd3c459ed097841742bb6 # master
    with:
      scandir: ./.scripts
      severity: warning
