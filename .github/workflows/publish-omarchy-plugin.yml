---
name: Publish Omarchy plugin

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - "omarchy-plugin/**"
      - "LICENSE"
      - ".github/workflows/publish-omarchy-plugin.yml"
  pull_request:
    paths:
      - "omarchy-plugin/**"
      - "LICENSE"
      - ".github/workflows/publish-omarchy-plugin.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-omarchy-plugin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: timmo001/workflows/.github/workflows/validate-omarchy-plugin.yml@36ba6651f1296cce685ede8ac38b9574c9291028 # master
    with:
      plugin-directory: omarchy-plugin

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    uses: timmo001/workflows/.github/workflows/publish-omarchy-plugin.yml@36ba6651f1296cce685ede8ac38b9574c9291028 # master
    with:
      plugin-directory: omarchy-plugin
      publish-repository: timmo001/omarchy-notes
    secrets:
      DEPLOY_KEY: ${{ secrets.OMARCHY_PLUGIN_DEPLOY_KEY }}
