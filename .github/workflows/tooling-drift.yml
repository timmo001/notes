---
name: Tooling drift

# Opens a review pull request when a Herdr release is newer than the one
# recorded in tooling.yml, through the tooling-drift tool pinned in mise.toml.
# See the tooling-drift skill.

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tooling-drift
  cancel-in-progress: false

jobs:
  drift:
    if: github.repository == 'timmo001/notes'
    uses: timmo001/workflows/.github/workflows/tooling-drift.yml@de4221cd9b24ad3d61aa1db87b6e4864cf56d5a1 # 20261027.0
    permissions:
      actions: write
      contents: write
      pull-requests: write
    secrets:
      token: ${{ secrets.TOOLING_DRIFT_TOKEN }}
