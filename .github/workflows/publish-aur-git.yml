---
name: Publish AUR git package

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - src/**
      - package.json
      - bun.lock
      - mise.toml
      - LICENSE
      - .scripts/linux/PKGBUILD
      - .scripts/linux/repo-notes.install
      - .scripts/linux/prepare-aur.sh
      - .github/workflows/publish-aur-git.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-aur-git-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish AUR (repo-notes-git)
    uses: timmo001/workflows/.github/workflows/publish-aur.yml@5ca45f8d789b67b2c3c14aea6062a379d6c37db1 # 20261123.0
    with:
      package-name: repo-notes-git
      prepare-command: .scripts/linux/prepare-aur.sh "$AUR_PACKAGE_DIR"
      auxiliary-file-paths: repo-notes.install
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
