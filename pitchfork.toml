# Keeps the capture PWA and docs dev servers running in the background, outside
# the invoking shell or agent. Manage them with the serve:* mise tasks.

[daemons.capture]
dir = "capture"
run = 'exec bun run dev --host 127.0.0.1 --port "$PORT" --strictPort'
port = { expect = [7490], bump = 10 }
ready_cmd = 'curl -fsS "http://127.0.0.1:$PORT/"'
health_cmd = 'curl -fsS "http://127.0.0.1:$PORT/"'
retry = true

[daemons.docs]
dir = "docs"
run = 'exec bunx blume dev --host 127.0.0.1 --port "$PORT"'
port = { expect = [7470], bump = 10 }
ready_cmd = 'curl -fsS "http://127.0.0.1:$PORT/"'
health_cmd = 'curl -fsS "http://127.0.0.1:$PORT/"'
retry = true
